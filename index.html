<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agenda : vue jour d'événements, en React 19" />
    <title>Agenda</title>
    <style>
      /* Shown before the JavaScript runs, hence inline: no stylesheet to wait for. */
      .boot {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        color: #59636e;
      }
      .boot-spinner {
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto 1rem;
        border: 3px solid #3a5bd9;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-title {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: #1f2328;
      }
      .boot-message {
        max-width: 26rem;
        margin: 0;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on its first render. -->
      <div class="boot" role="status">
        <div>
          <div class="boot-spinner" aria-hidden="true"></div>
          <p class="boot-title">Le serveur se réveille…</p>
          <p class="boot-message">
            Il est hébergé gratuitement et se met en veille quand personne ne l'utilise. Son réveil
            peut prendre jusqu'à une minute, merci de votre patience.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
